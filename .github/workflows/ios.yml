name: iOS build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
          xcodebuild -list -project ios/FantasyMarket.xcodeproj
      - name: Test message links and market calculations
        run: |
          mkdir -p build
          swiftc ios/FantasyMarketMessages/Models.swift ios/FantasyMarketMessages/MarketInvite.swift scripts/test-market-models.swift -o build/market-model-tests
          build/market-model-tests
      - name: Build simulator and device archive without signing
        run: |
          set -o pipefail
          xcodebuild -project ios/FantasyMarket.xcodeproj -scheme FantasyMarket -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build | tee simulator.log
          xcodebuild -project ios/FantasyMarket.xcodeproj -scheme FantasyMarket -configuration Release -destination 'generic/platform=iOS' -archivePath build/FantasyMarket.xcarchive CODE_SIGNING_ALLOWED=NO archive | tee archive.log
      - name: Verify embedded extension
        run: python3 scripts/verify-ios-bundle.py build/FantasyMarket.xcarchive/Products/Applications/FantasyMarket.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-evidence
          path: |
            *.log
            ios/FantasyMarket.xcodeproj
            build/FantasyMarket.xcarchive
          retention-days: 7
