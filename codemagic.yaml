workflows:
  fantasy-market-ios:
    name: Fantasy Market iMessage
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mlyin.FantasyMarket
      vars:
        XCODE_PROJECT: "ios/FantasyMarket.xcodeproj"
        XCODE_SCHEME: "FantasyMarket"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build archive
        script: |
          # App Store Connect rejects a repeated build number, so stamp every archive
          # with Codemagic's own build counter (both targets get the same value).
          BUILD_NO=${PROJECT_BUILD_NUMBER:-${BUILD_NUMBER:-1}}
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NO"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
