name: FantasyMarket
options:
  bundleIdPrefix: com.mlyin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  FantasyMarket:
    type: application
    platform: iOS
    sources:
      - FantasyMarket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlyin.FantasyMarket
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fantasy Market
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: FantasyMarketMessages
        embed: true
  FantasyMarketMessages:
    type: app-extension
    platform: iOS
    sources:
      - FantasyMarketMessages
    info:
      path: FantasyMarketMessages/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlyin.FantasyMarket.MessagesExtension
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  FantasyMarket:
    build:
      targets:
        FantasyMarket: all
        FantasyMarketMessages: all
    archive:
      config: Release
